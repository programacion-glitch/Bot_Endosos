# El portal web vive en el repo Portal_H2O (servicio portal-h2o, puerto 80).
# Este compose solo corre el bot; el volumen botdata lo comparte con el portal
# (el portal lo monta como externo para encolar jobs en jobs.db).
services:
  bot:
    build: .
    container_name: endosos-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HEADLESS=true
    volumes:
      - botdata:/app/data
      - ./downloads:/app/downloads
      - ./logs/bot:/app/logs
    # Chromium necesita /dev/shm amplio (evita crashes con páginas pesadas)
    shm_size: '2gb'

volumes:
  botdata:
